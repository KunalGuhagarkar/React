1. Send message by pressing the Enter Key.
2. Clear input by pressing the Esc Key.
3. Add async and await

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot</title>
    <style>
      .send-btn {
        background-color: rgb(25, 135, 84);
        color: white;
        padding: 12px 20px;
        margin-left: 12px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
      }

      .send-btn:hover {
        cursor: pointer;
        background-color: rgb(46, 211, 117);
      }

      .chat-input {
        padding: 12px 15px;
        border-radius: 10px;
        font-size: 15px;
        flex-grow: 1;
      }

      .chat-input-container {
        display: flex;
        margin-bottom: 50px;
      }

      .app-container {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }

      .chat-message-user {
        display: flex;
        justify-content: flex-end;
        align-items: center;
      }

      .chat-message-robot {
        display: flex;
        justify-content: flex-start;
        align-items: center;
      }

      .message-text {
        background-color: rgba(205, 205, 205, 0.744);
        margin: 0 10px;
        margin-bottom: 20px;
        padding: 10px 15px;
        border-radius: 10px;
        font-family: Arial, Helvetica, sans-serif;
        max-width: 300px;
      }

    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="chatbot.js"></script>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const root = document.getElementById("root");

      function ChatInput({ chatMessages, setChatMessages, isLoading }) {
        const [message, setMessage] = React.useState("");

        function saveInputText(e) {
          setMessage(e.target.value);
        }

        async function sendMessage() {
          const newChatMessages = [
            ...chatMessages,
            {
              message: message,
              sender: "user",
              id: crypto.randomUUID(),
            },
          ];

          setChatMessages(newChatMessages);

          const loading = [
            ...newChatMessages,
            {
              message: "loading...",
              sender: "robot",
              id: crypto.randomUUID(),
            },
          ];

          setChatMessages(loading);

          await isLoading(loading[loading.length - 1]);

          const response = await Chatbot.getResponseAsync(message);
          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender: "robot",
              id: crypto.randomUUID(),
            },
          ]);

          await isLoading(newChatMessages[newChatMessages.length - 1]);

          setMessage("");
        }

        function handleKeyPress(e) {
          e.key == "Enter" && sendMessage();
          e.key == "Escape" && setMessage("");
        }

        return (
          <div className="chat-input-container">
            <input
              type="text"
              placeholder="Send a message to Chatbot"
              onChange={saveInputText}
              value={message}
              onKeyDown={handleKeyPress}
              className="chat-input"
            />
            <button
              className="send-btn"
              onClick={
                message.length > 0 ? sendMessage : console.log("Field is Empty")
              }
            >
              Send
            </button>
          </div>
        );
      }

      function ChatComponent({ message, sender }) {
        return (
          <div className={sender === 'user' ? 'chat-message-user' : 'chat-message-robot'}>
            {sender == "robot" && (
              <img
                src="\React-Course\3-State-EventHandlers\notes\assets\robot.png"
                width="50"
              />
            )}
            <p className="message-text">{message}</p>
            {sender == "user" && (
              <img
                src="\React-Course\3-State-EventHandlers\notes\assets\user.png"
                width="50"
              />
            )}
          </div>
        );
      }

      function ChatMessages({ chatMessages }) {
        // Move this is <App /> Component -> Lifting the state up
        /* const [chatMessages, setChatMessages] = React.useState([
          {
            id: "id1",
            message: "hello Chatbot",
            sender: "user",
          },
          {
            id: "id2",
            message: "Hello! How can I help you?",
            sender: "robot",
          },
          {
            id: "id3",
            message: "can you get me today's date?",
            sender: "user",
          },
          {
            id: "id4",
            message: "Today is May 20",
            sender: "robot",
          },
        ]); */

        /* const array = React.useState([
          {
            id: "id1",
            message: "hello Chatbot",
            sender: "user",
          },
          {
            id: "id2",
            message: "Hello! How can I help you?",
            sender: "robot",
          },
          {
            id: "id3",
            message: "can you get me today's date?",
            sender: "user",
          },
          {
            id: "id4",
            message: "Today is May 20",
            sender: "robot",
          },
        ]); */

        // Array Destructuring Shortcut
        // const [chatMessages, setChatMessages] = array;

        // const chatMessages = array[0]; // Current data
        // const setChatMessages = array[1]; // Updater Function

        /* const chatMessagesComponent = chatMessages.map((chat) => (
          <ChatMessage message={chat.message} sender={chat.sender} />
        )); */

        return (
          <>
            {chatMessages.map((chat) => (
              <ChatComponent
                message={chat.message}
                sender={chat.sender}
                key={chat.id}
              />
            ))}
          </>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([
          {
            id: "id1",
            message: "hello Chatbot",
            sender: "user",
          },
          {
            id: "id2",
            message: "Hello! How can I help you?",
            sender: "robot",
          },
          {
            id: "id3",
            message: "can you get me today's date?",
            sender: "user",
          },
          {
            id: "id4",
            message: "Today is May 20",
            sender: "robot",
          },
        ]);

        function handleLoading(loading) {
          loading.message == "loading..."
            ? ((document.querySelector("input").disabled = true),
              (document.querySelector("button").disabled = true))
            : ((document.querySelector("input").disabled = false),
              (document.querySelector("button").disabled = false));
        }

        return (
          <div className="app-container">
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
              isLoading={handleLoading}
            />
            <ChatMessages chatMessages={chatMessages} />
          </div>
        );
      }

      ReactDOM.createRoot(root).render(<App />);
    </script>
  </body>
</html>
