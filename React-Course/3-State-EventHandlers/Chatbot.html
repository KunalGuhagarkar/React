<!-- Learning Components and Props by making a Chatbot -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot</title>
  </head>
  <body>
    <div id="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const root = document.getElementById("root");

      function ChatInput() {

        const [message, setMessage] = React.useState("");

        function saveInputText(e) {
          setMessage(e.target.value);
        }

        function sendMessage() {
          
        }

        return (
          <>
            <input
              type="text"
              placeholder="Send a message to Chatbot"
              size="30"
              onChange={saveInputText}
            />
            <button onClick={sendMessage}>Send</button>
          </>
        );
      }

      function ChatComponent({ message, sender }) {
        return (
          <div>
            {sender == "robot" && (
              <img src="notes/assets/robot.png" width="50" />
            )}
            {message}
            {sender == "user" && <img src="notes/assets/user.png" width="50" />}
          </div>
        );
      }

      function ChatMessages() {

        const [chatMessages, setChatMessages] = React.useState([
          {
            id: "id1",
            message: "hello Chatbot",
            sender: "user",
          },
          {
            id: "id2",
            message: "Hello! How can I help you?",
            sender: "robot",
          },
          {
            id: "id3",
            message: "can you get me today's date?",
            sender: "user",
          },
          {
            id: "id4",
            message: "Today is May 20",
            sender: "robot",
          },
        ]);

        /* const array = React.useState([
          {
            id: "id1",
            message: "hello Chatbot",
            sender: "user",
          },
          {
            id: "id2",
            message: "Hello! How can I help you?",
            sender: "robot",
          },
          {
            id: "id3",
            message: "can you get me today's date?",
            sender: "user",
          },
          {
            id: "id4",
            message: "Today is May 20",
            sender: "robot",
          },
        ]); */

        // Array Destructuring Shortcut
        // const [chatMessages, setChatMessages] = array;

        // const chatMessages = array[0]; // Current data
        // const setChatMessages = array[1]; // Updater Function

        /* const chatMessagesComponent = chatMessages.map((chat) => (
          <ChatMessage message={chat.message} sender={chat.sender} />
        )); */

        function sendMessage() {
          /* chatMessages.push({
            message: "test",
            sender: "user",
            id: crypto.randomUUID(),
          });
          console.log(chatMessages); */
          setChatMessages([
            ...chatMessages,
            {
              message: "test",
              sender: "user",
              id: crypto.randomUUID(),
            },
          ]);
        }

        return (
          <>
            <button onClick={sendMessage}>Send Message</button>

            {chatMessages.map((chat) => (
              <ChatComponent
                message={chat.message}
                sender={chat.sender}
                key={chat.id}
              />
            ))}
          </>
        );
      }

      function App() {
        return (
          <>
            <ChatInput />
            <ChatMessages />
          </>
        );
      }

      ReactDOM.createRoot(root).render(<App />);
    </script>
  </body>
</html>
