<!-- 
Question:
Create a Reset button that sets the count to 0 for all buttons
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 5</title>
  </head>
  <body>
    <div id="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const root = document.getElementById("root");

      function CounterComponent({ count, setCount }) {
        function handleClick() {
          setCount(count + 1);
        }

        return (
          <>
            {count == 1 ? (
              <button onClick={handleClick}>Clicked {count} time</button>
            ) : (
              <button onClick={handleClick}>Clicked {count} times</button>
            )}
          </>
        );
      }

      function App() {
        const [count, setCount] = React.useState(0);

        return (
          <>
            <CounterComponent count={count} setCount={setCount} />
            <CounterComponent count={count} setCount={setCount} />
          </>
        );
      }

      ReactDOM.createRoot(root).render(<App />);
    </script>
  </body>
</html>
