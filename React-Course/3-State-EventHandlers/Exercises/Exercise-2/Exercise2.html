<!-- 
Question:
Save a count. The count should have a initial value of 0, and React.useState() should have 2 values:
  1. Update the text in the button so it displays the count instead of 0.
  2. When clicking the button, use the update function to increase the count by 1.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 2</title>
  </head>
  <body>
    <div id="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const root = document.getElementById("root");
      
      function handleClick() {
        setCount(count + 1);
        console.log(count);
      }

      function App() {

        const [count, setCount] = React.useState(0);

        return (
          <>
            <button onClick={handleClick}>Clicked {count} times</button>
          </>
        )
      }

      ReactDOM.createRoot(root).render(<App />);
    </script>
  </body>
</html>
