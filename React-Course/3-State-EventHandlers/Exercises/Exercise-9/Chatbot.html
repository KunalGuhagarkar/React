1. Send message by pressing the Enter Key.
2. Clear input by pressing the Esc Key.
3. Add async and await

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot</title>
  </head>
  <body>
    <div id="root"></div>

    <script src="chatbot.js"></script>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const root = document.getElementById("root");

      function ChatInput({ chatMessages, setChatMessages, handleLoading }) {
        const [message, setMessage] = React.useState("");

        function saveInputText(e) {
          setMessage(e.target.value);
        }

        async function sendMessage() {
          const newChatMessages = [
            ...chatMessages,
            {
              message: message,
              sender: "user",
              id: crypto.randomUUID(),
            },
          ];

          setChatMessages(newChatMessages);
          
          setChatMessages([
            ...newChatMessages,
            {
              message: "loading...",
              sender: "robot",
              id: crypto.randomUUID(),
            },
          ]);

          function handleLoading() {
            console.log(chatMessages);
          }

          const response = await Chatbot.getResponseAsync(message);
          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender: "robot",
              id: crypto.randomUUID(),
            },
          ]);

          setMessage("");
        }

        function handleKeyPress(e) {
          e.key == "Enter" && sendMessage();
          e.key == "Escape" && setMessage("");
        }

        return (
          <>
            <input
              type="text"
              placeholder="Send a message to Chatbot"
              size="30"
              onChange={saveInputText}
              value={message}
              onKeyDown={handleKeyPress}
            />
            <button onClick={sendMessage}>Send</button>
          </>
        );
      }

      function ChatComponent({ message, sender }) {
        return (
          <div>
            {sender == "robot" && (
              <img
                src="\React-Course\3-State-EventHandlers\notes\assets\robot.png"
                width="50"
              />
            )}
            {message}
            {sender == "user" && (
              <img
                src="\React-Course\3-State-EventHandlers\notes\assets\user.png"
                width="50"
              />
            )}
          </div>
        );
      }

      function ChatMessages({ chatMessages }) {
        // Move this is <App /> Component -> Lifting the state up
        /* const [chatMessages, setChatMessages] = React.useState([
          {
            id: "id1",
            message: "hello Chatbot",
            sender: "user",
          },
          {
            id: "id2",
            message: "Hello! How can I help you?",
            sender: "robot",
          },
          {
            id: "id3",
            message: "can you get me today's date?",
            sender: "user",
          },
          {
            id: "id4",
            message: "Today is May 20",
            sender: "robot",
          },
        ]); */

        /* const array = React.useState([
          {
            id: "id1",
            message: "hello Chatbot",
            sender: "user",
          },
          {
            id: "id2",
            message: "Hello! How can I help you?",
            sender: "robot",
          },
          {
            id: "id3",
            message: "can you get me today's date?",
            sender: "user",
          },
          {
            id: "id4",
            message: "Today is May 20",
            sender: "robot",
          },
        ]); */

        // Array Destructuring Shortcut
        // const [chatMessages, setChatMessages] = array;

        // const chatMessages = array[0]; // Current data
        // const setChatMessages = array[1]; // Updater Function

        /* const chatMessagesComponent = chatMessages.map((chat) => (
          <ChatMessage message={chat.message} sender={chat.sender} />
        )); */

        return (
          <>
            {chatMessages.map((chat) => (
              <ChatComponent
                message={chat.message}
                sender={chat.sender}
                key={chat.id}
              />
            ))}
          </>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([
          {
            id: "id1",
            message: "hello Chatbot",
            sender: "user",
          },
          {
            id: "id2",
            message: "Hello! How can I help you?",
            sender: "robot",
          },
          {
            id: "id3",
            message: "can you get me today's date?",
            sender: "user",
          },
          {
            id: "id4",
            message: "Today is May 20",
            sender: "robot",
          },
        ]);

        return (
          <>
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
              isLoading={handleLoading}
            />
            <ChatMessages chatMessages={chatMessages} />
          </>
        );
      }

      ReactDOM.createRoot(root).render(<App />);
    </script>
  </body>
</html>
