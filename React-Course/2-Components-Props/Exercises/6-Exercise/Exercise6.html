<!--
  Question:
  Add 2 more products and create a component <ProductDetails/> use props to make it reusable.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 6</title>
  </head>
  <body>
    <div id="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const root = document.getElementById("root");

      function ProductDetails({ product, price }) {
        return (
          <div>
            <p>{product}</p>
            <p>Price: ${price}</p>
            <button>Add To Cart</button>
          </div>
        );
      }

      function App() {
        return (
          <>
            <ProductDetails product="Cotton socks" price={10.9} />
            <ProductDetails product="Tennis balls" price={6.0} />
            <ProductDetails product="Plain T-Shirt" price={7.99} />
          </>
        );
      }

      ReactDOM.createRoot(root).render(<App />);
    </script>
  </body>
</html>
