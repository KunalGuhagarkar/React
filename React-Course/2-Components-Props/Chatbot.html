<!-- Learning Components and Props by making a Chatbot -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot</title>
  </head>
  <body>
    <div id="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const root = document.getElementById("root");

      function ChatInput() {
        return (
          <>
            <input type="text" placeholder="Send a message to Chatbot" size="30" />
            <button>Send</button>
          </>
        );
      }

      function ChatMessage(props) {
        return (
          <div>
            {props.message}
            <img src="notes\assets\user.png" alt="Profile Image" width="50px" />
          </div>
        );
      }

      const app = (
        <>
          <ChatInput />
          <ChatMessage message="hello Chatbot" />
          <ChatMessage message="Hello! How can I help you?" />
        </>
      )

      ReactDOM.createRoot(root).render(app);
    </script>
  </body>
</html>
