<!-- 
Question: 
  Use DayJS an external library to get the current date. Display the result in the console.

  Insert the date in the paragraph element, and display it on the website.

  Using DayJS, get the current time and display it on the website.

  Create a clock using setInterval()
-->

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Exercise 1</title>
</head>

<body>

  <div id="root"></div>

  <!-- React -->
  <script
    crossorigin
    src="https://unpkg.com/react@18/umd/react.development.js"
  ></script>

  <!-- ReactDOM -->
  <script
    crossorigin
    src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
  ></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- DayJS -->
  <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

  <script type="text/babel">

    const root = ReactDOM.createRoot(
      document.getElementById("root")
    );

    function updateFunction() {

      // Current Date
      const today = dayjs().format("MMMM D");

      // Current Time
      const currentTime = dayjs().format("HH:mm:ss");

      // Display in console
      console.log(today);

      // Render to Website
      root.render(
        <>
          <p>Today is {today}</p>

          <p>
            Current Time: {currentTime}
          </p>
        </>
      );
    }

    // Initial Render
    updateFunction();

    // Update every second
    setInterval(updateFunction, 1000);

  </script>

</body>

</html>
