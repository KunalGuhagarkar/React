<!-- 
Question: 
  Use DayJS an external library to get the current date. Display the result in the console.

  Insert the date in the paragraph element, and display it on the website.

  Using DayJS, get the current time and display it on the website.

  Create a clock using setInterval()
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 1</title>
  </head>
  <body>
    <div id="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script type="text/babel">
      const root = document.getElementById("root");

      console.log(dayjs().format('MMMM D'));
      const today = dayjs().format('MMMM D');

      const p = <p>Today is {today}</p>

      const currentTime = dayjs().format('HH:mm:ss');
      const p2 = <p>Current Time: {currentTime}</p>


      ReactDOM.createRoot(root).render(
        setInterval(() => {
          <p>{dayjs().format('HH:mm:ss')}</p>
        }, 1000)
      );
    </script>
  </body>
</html>
