<!-- 
Question: 
  You buy 1 pack of socks for $10 and 2 T-shirts for $8 each. Using JavaScript, calculate the total cost of this order, save it in a variable named productCost, and display it in the Console.

  Insert the productCost variable into a paragraph element, create the design below, and display it on the website.

  Lets pretend the shipping cost is $5. Save this in a variable named shippingCost, calculate the total cost using JavaScript (productCost + shippingCost), and display the results on the website using the design.
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 1</title>
  </head>
  <body>

    <div id="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const root = document.getElementById("root");

      const socksPrice = 10;
      const tshirtPrice = 8;

      const productCost = socksPrice + (2 * tshirtPrice);

      const shippingCost = 5;

      const totalCost = productCost + shippingCost;

      console.log(productCost);

      const div = (
        <div>
          <p>Product cost: ${productCost}</p>
          <p>Shipping cost: ${shippingCost}</p>
          <p>Total cost: ${totalCost}</p>
          <button>Place your order</button>
        </div>
      );

      ReactDOM.createRoot(root).render(div);
    </script>
  </body>
</html>
